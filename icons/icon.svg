<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004B3D"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#74c69d"/>
    </linearGradient>
    <radialGradient id="pot" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ddb892"/>
      <stop offset="100%" stop-color="#a47148"/>
    </radialGradient>
  </defs>
  
  <!-- 배경 원 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- 화분 -->
  <path d="M180 340 L190 400 Q200 420 256 420 Q312 420 322 400 L332 340 Q310 350 256 350 Q202 350 180 340" fill="url(#pot)" opacity="0.95"/>
  <ellipse cx="256" cy="340" rx="76" ry="20" fill="#c9a66b" opacity="0.9"/>
  
  <!-- 흙 -->
  <ellipse cx="256" cy="340" rx="70" ry="16" fill="#8b5a2b" opacity="0.8"/>
  
  <!-- 줄기 -->
  <path d="M256 340 L256 200" stroke="#588157" stroke-width="12" stroke-linecap="round"/>
  
  <!-- 왼쪽 잎 -->
  <ellipse cx="200" cy="220" rx="50" ry="80" fill="url(#leaf1)" opacity="0.95" transform="rotate(-30 200 220)"/>
  <path d="M200 280 Q200 220 200 160" stroke="#74c69d" stroke-width="3" fill="none" opacity="0.5" transform="rotate(-30 200 220)"/>
  
  <!-- 오른쪽 잎 -->
  <ellipse cx="312" cy="220" rx="50" ry="80" fill="url(#leaf1)" opacity="0.95" transform="rotate(30 312 220)"/>
  <path d="M312 280 Q312 220 312 160" stroke="#74c69d" stroke-width="3" fill="none" opacity="0.5" transform="rotate(30 312 220)"/>
  
  <!-- 중앙 새싹 -->
  <ellipse cx="256" cy="160" rx="35" ry="60" fill="url(#leaf2)" opacity="0.95"/>
  <path d="M256 200 Q256 160 256 110" stroke="#95d5b2" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- 작은 잎들 -->
  <ellipse cx="230" cy="260" rx="25" ry="40" fill="url(#leaf2)" opacity="0.85" transform="rotate(-20 230 260)"/>
  <ellipse cx="282" cy="260" rx="25" ry="40" fill="url(#leaf2)" opacity="0.85" transform="rotate(20 282 260)"/>
  
  <!-- 하이라이트 -->
  <ellipse cx="195" cy="190" rx="15" ry="25" fill="#b7e4c7" opacity="0.3" transform="rotate(-30 195 190)"/>
  <ellipse cx="317" cy="190" rx="15" ry="25" fill="#b7e4c7" opacity="0.3" transform="rotate(30 317 190)"/>
</svg>
